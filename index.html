<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climbing Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Climbing Log</h1>
    <p>Mobile dataframe row generator</p>
  </header>

  <main>
    <section class="card">
      <h2>Session header</h2>

      <label>Date
        <input id="date" type="date" />
      </label>

      <label>Session type
        <select id="session_type">
          <option value="G">Gym</option>
          <option value="C">Climbing</option>
        </select>
      </label>

      <label>Site
        <input id="site" type="text" placeholder="Home, gym, crag..." />
      </label>

      <label>Duration min
        <input id="duration_min" type="number" inputmode="numeric" placeholder="90" />
      </label>

      <label>Session RPE
        <select id="session_rpe">
          <option value=""></option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>

      <label>Session focus
        <input
          id="focus"
          type="text"
          placeholder="Strength, power, endurance, technique..."
        />
      </label>

      <label>Focus level
      <select id="focus_level">
        <option value=""></option>
        <option value="1">1 — Very distracted</option>
        <option value="2">2</option>
        <option value="3">3 — Somewhat distracted</option>
        <option value="4">4</option>
        <option value="5" selected>5 — Moderately focused</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10 — Extremely focused</option>
      </select>
    </label>

      <label>Comments
        <textarea id="comments" rows="2" placeholder="Optional"></textarea>
      </label>

      <div id="bodyweight_section">

  <div id="bodyweight_display" class="hidden">
    <span id="bodyweight_text"></span>

    <button
      id="change_bodyweight"
      type="button"
    >
      Change
    </button>
  </div>

  <div id="bodyweight_editor">
    <label>
      Bodyweight
      <input
        id="bodyweight"
        type="number"
        inputmode="decimal"
        step="0.1"
        placeholder="kg"
      />
    </label>

    <button
      id="save_bodyweight"
      type="button"
    >
      Save bodyweight
    </button>
  </div>

</div>
    </section>

    <section class="card">
      <h2>Add row</h2>

      <label id="entry_type_label">
      Entry type
        <select id="entry_type">
        <option value="exercise">Exercise</option>
        <option value="route">Route</option>
        <option value="boulder">Boulder</option>
        </select>
      </label>

      <div id="exercise_form">
        <label>Block
          <select id="block"></select>
        </label>

        <label>Exercise
          <select id="exercise"></select>
        </label>

<div id="exercise_max_section">
<div id="exercise_max_display" class="hidden">
  <span id="exercise_max_text"></span>

  <button
    id="change_exercise_max"
    type="button"
  >
    Change
  </button>
</div>
  <!-- Bilateral maximum -->
  <div id="exercise_max_bilateral_editor">

    <label>
      Maximum strength
      <input
        id="exercise_max_strength"
        type="text"
        inputmode="text"
        placeholder="e.g. 100, BW, BW+20"
      />
    </label>

    <button
      id="save_exercise_max"
      type="button"
    >
      Save bilateral max
    </button>

  </div>


  <!-- Left / Right maximums -->
  <div
    id="exercise_max_unilateral_editor"
    class="hidden"
  >

    <label>
      Left max
      <input
        id="exercise_max_left"
        type="text"
        inputmode="text"
        placeholder="e.g. 35, BW+10"
      />
    </label>

    <label>
      Right max
      <input
        id="exercise_max_right"
        type="text"
        inputmode="text"
        placeholder="e.g. 38, BW+12"
      />
    </label>

    <button
      id="save_exercise_max_unilateral"
      type="button"
    >
      Save left / right max
    </button>

  </div>

</div>

<label class="checkbox-label">
  <input
    id="unilateral"
    type="checkbox"
  />
  <span>Unilateral</span>
</label>

<label class="checkbox-label">
  <input
    id="explosive_strength"
    type="checkbox"
  />
  <span>Explosive strength</span>
</label>

<div id="finger_options" class="hidden">
  <label class="checkbox-label">
    <input
      id="active_strength"
      type="checkbox"
    />
    <span>Active strength</span>
  </label>

  <label>Arm configuration
    <select id="arm_configuration">
      <option value="two_arms">Two arms</option>
      <option value="one_arm">One arm</option>
    </select>
  </label>

<label>Grip type
  <select id="grip_type">
    <option value="half_crimp" selected>Half crimp</option>
    <option value="open_hand">Open hand</option>
    <option value="three_finger_drag">Three-finger drag</option>
    <option value="two_finger_pocket">Two-finger pocket</option>
    <option value="mono_pocket">Mono pocket</option>
  </select>
</label>
</div>

<div id="set_blocks"></div>

<button type="button" id="add_set_block">+ Add set block</button>

        <label>RPE (1st set)
          <select id="ex_rpe">
            <option value=""></option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
      </div>

      <div id="climb_form" class="hidden">
 <div id="climb_max_section">

  <!-- Compact display when a max is already saved -->
  <div id="climb_max_display" class="hidden">
    <span id="climb_max_text"></span>

    <button
      id="change_climb_max"
      type="button"
    >
      Change
    </button>
  </div>

  <!-- Editor shown only if no max exists or Change is clicked -->
  <div id="climb_max_editor">

    <div id="route_max_section" class="hidden">
      <label>
        Maximum route grade
        <select id="max_route_grade">
          <option value="">Not set</option>
          <option value="3">3</option>
          <option value="4a">4a</option>
          <option value="4b">4b</option>
          <option value="4c">4c</option>
          <option value="5a">5a</option>
          <option value="5b">5b</option>
          <option value="5c">5c</option>
          <option value="6a">6a</option>
          <option value="6a+">6a+</option>
          <option value="6b">6b</option>
          <option value="6b+">6b+</option>
          <option value="6c">6c</option>
          <option value="6c+">6c+</option>
          <option value="7a">7a</option>
          <option value="7a+">7a+</option>
          <option value="7b">7b</option>
          <option value="7b+">7b+</option>
          <option value="7c">7c</option>
          <option value="7c+">7c+</option>
          <option value="8a">8a</option>
          <option value="8a+">8a+</option>
          <option value="8b">8b</option>
          <option value="8b+">8b+</option>
          <option value="8c">8c</option>
          <option value="8c+">8c+</option>
          <option value="9a">9a</option>
          <option value="9a+">9a+</option>
          <option value="9b">9b</option>
          <option value="9b+">9b+</option>
          <option value="9c">9c</option>
        </select>
      </label>
    </div>

    <div id="boulder_max_section" class="hidden">
      <label>
        Maximum boulder grade
        <select id="max_boulder_grade">
          <option value="">Not set</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="4+">4+</option>
          <option value="5">5</option>
          <option value="5+">5+</option>
          <option value="6A">6A</option>
          <option value="6A+">6A+</option>
          <option value="6B">6B</option>
          <option value="6B+">6B+</option>
          <option value="6C">6C</option>
          <option value="6C+">6C+</option>
          <option value="7A">7A</option>
          <option value="7A+">7A+</option>
          <option value="7B">7B</option>
          <option value="7B+">7B+</option>
          <option value="7C">7C</option>
          <option value="7C+">7C+</option>
          <option value="8A">8A</option>
          <option value="8A+">8A+</option>
          <option value="8B">8B</option>
          <option value="8B+">8B+</option>
          <option value="8C">8C</option>
          <option value="8C+">8C+</option>
          <option value="9A">9A</option>
        </select>
      </label>
    </div>

    <button
      id="save_max_grades"
      type="button"
    >
      Save maximum grade
    </button>

  </div>

</div>
        <label>Grade
          <select id="grade"></select>
        </label>

        <label>Style
          <select id="style">
            <option value="S">Slab</option>
            <option value="V">Vertical</option>
            <option value="OH">Overhang</option>
          </select>
        </label>

        <label>Length
          <select id="length">
            <option value="SH">Short</option>
            <option value="M" selected>Medium</option>
            <option value="L">Long</option>
            <option value="EL">Extra long</option>
          </select>
        </label>

        <label>Attempts
          <input id="attempts" type="number" inputmode="numeric" placeholder="3" />
        </label>

        <label>Mode
          <select id="mode">
            <option value="F">Flash</option>
            <option value="O">Onsight</option>
            <option value="R">Redpoint</option>
          </select>
        </label>

        <label>Done
          <select id="done">
            <option value="Y">Yes</option>
            <option value="N">No</option>
          </select>
        </label>

        <label>RPE (1st run)
          <select id="climb_rpe">
            <option value=""></option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
      </div>

    <label id="entry_comment_container">Entry comment
    <textarea
      id="entry_comment"
      rows="2"
      placeholder="Comment about this exercise or climb..."
    ></textarea>
  </label>

      <button id="add_row">Add row</button>
    </section>

    <section class="card">
      <h2>Current data</h2>
      <div class="buttons">
        <button id="export_csv">Export CSV</button>
        <button id="clear_data" class="danger">Clear all</button>
      </div>

      <div class="table-wrap">
        <table id="preview_table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="exercise_catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
